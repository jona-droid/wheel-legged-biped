; =====================================================================
;  Wheel-legged biped firmware  -  one project, one environment per stage.
;  In VS Code: pick the environment in the blue status bar (env:...), then Upload and Monitor.
;
;   stage1_imu      read the MPU6050: pitch, roll, yaw rate          (USB only)
;   stage2_motors   spin the wheels, check directions + deadband     (USB + battery, jumper OFF)
;   stage3_legs     servos: attach horns, calibrate the legs         (USB + battery, jumper OFF)
;   stage4_balance  balance with the legs held still + phone tuning  (battery)
;   stage5_drive    + joystick on the phone                          (battery)
;   stage6_legs     + height slider, lean into turns, levelling      (battery)
; =====================================================================

[env]
; Same pinned platform as the balancing bot (Arduino core 3.3.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude

[env:stage1_imu]
build_src_filter = +<stage1_imu.cpp>

[env:stage2_motors]
build_src_filter = +<stage2_motors.cpp>

[env:stage3_legs]
build_src_filter = +<stage3_legs.cpp>

[env:stage4_balance]
build_src_filter = +<biped_main.cpp>
build_flags = ${env.build_flags} -DENABLE_DRIVE=0 -DENABLE_LEGS=0

[env:stage5_drive]
build_src_filter = +<biped_main.cpp>
build_flags = ${env.build_flags} -DENABLE_DRIVE=1 -DENABLE_LEGS=0

[env:stage6_legs]
build_src_filter = +<biped_main.cpp>
build_flags = ${env.build_flags} -DENABLE_DRIVE=1 -DENABLE_LEGS=1
